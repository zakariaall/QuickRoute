
services:
  # 🐘 PostgreSQL (Base relationnelle : Order, Payment, Catalog)
  postgres:
    image: postgres:15-alpine
    container_name: quickroute-postgres
    environment:
      POSTGRES_USER: quickroute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: quickroute_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quickroute-net

  # 🖥️ PgAdmin (Interface web pour PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4
    container_name: quickroute-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@quickroute.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - quickroute-net

  # 🍃 MongoDB (Base NoSQL : Tracking, Géolocalisation)
  mongodb:
    image: mongo:6
    container_name: quickroute-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - quickroute-net

  # 🖥️ Mongo Express (Interface web pour MongoDB)
  mongo-express:
    image: mongo-express
    container_name: quickroute-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb
    networks:
      - quickroute-net

  # ⚡ Redis (Cache)
  redis:
    image: redis:7-alpine
    container_name: quickroute-redis
    ports:
      - "6379:6379"
    networks:
      - quickroute-net

  # 🔐 Keycloak (Serveur d'authentification IAM)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: quickroute-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev
    ports:
      - "9090:8080"
    networks:
      - quickroute-net

  # Instance dédiée à l'application QuickRoute, séparée de l'ancien Keycloak.
  keycloak-auth:
    image: quay.io/keycloak/keycloak:24.0
    container_name: quickroute-keycloak-auth
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/quickroute_keycloak
      KC_DB_USERNAME: quickroute
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command: start-dev --import-realm
    ports:
      - "9091:8080"
    volumes:
      - ./keycloak/quickroute-realm.json:/opt/keycloak/data/import/quickroute-realm.json:ro
    networks:
      - quickroute-net
    depends_on:
      - postgres

  # 📨 Zookeeper (Requis par Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: quickroute-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - quickroute-net

  # 📨 Apache Kafka (Le Broker d'événements)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: quickroute-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - quickroute-net

  # 🖥️ Kafka UI (Interface web pour voir les messages Kafka)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: quickroute-kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - quickroute-net

networks:
  quickroute-net:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
