name: CI

"on":
  push:
    branches:
      - main
      - develop
      - "features/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build Angular frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quickroute-frontend/package-lock.json

      - name: Install dependencies
        working-directory: quickroute-frontend
        run: npm ci

      - name: Build frontend
        working-directory: quickroute-frontend
        run: npm run build

  backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - catalog-restaurant-service
          - delivery-tracking-service
          - notification-service
          - order-service
          - payment-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build service
        working-directory: ${{ matrix.service }}
        run: bash ./gradlew --no-daemon build -x test
