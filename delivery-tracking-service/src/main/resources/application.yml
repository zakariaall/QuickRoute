server:
  port: 8084

spring:
  application:
    name: delivery-tracking-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9091/realms/quickroute
          jwk-set-uri: http://localhost:9091/realms/quickroute/protocol/openid-connect/certs

  data:
    mongodb:
      uri: mongodb://root:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/quickroute_tracking?authSource=admin

  datasource:
    url: jdbc:postgresql://localhost:5432/quickroute_db
    username: quickroute
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: tracking-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.quickroute.*"

management:
  endpoints:
    web:
      exposure:
        include: health,info
